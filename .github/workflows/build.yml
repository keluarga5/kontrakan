name: Build APK
on:
  workflow_dispatch:
  push:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build
        run: |
          unzip -o CatatanBayarKamar.zip
          cd CatatanBayarKamar
          gradle assembleDebug --no-daemon
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp CatatanBayarKamar/app/build/outputs/apk/debug/app-debug.apk CatatanBayarKamar.apk
          gh release delete apk -y --cleanup-tag || true
          gh release create apk CatatanBayarKamar.apk --title "APK Catatan Bayar Kamar" --notes "Unduh CatatanBayarKamar.apk lalu pasang di HP."
