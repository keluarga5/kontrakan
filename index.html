<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Catatan Kamar">
<meta name="theme-color" content="#1f7a5a">
<title>Catatan Bayar Kamar</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1d2320;--mu:#68716c;--ln:#e3e1da;--ac:#1f7a5a;--onac:#fff;--acb:#e1f2ea;--rd:#c0392b;--rdb:#fbe7e4;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141816;--card:#1f2421;--tx:#ecefed;--mu:#9aa49e;--ln:#2d3430;--ac:#4cc79b;--onac:#0b1a14;--acb:#1b3a2e;--rd:#ff7b6b;--rdb:#3d2220;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141816;--card:#1f2421;--tx:#ecefed;--mu:#9aa49e;--ln:#2d3430;--ac:#4cc79b;--onac:#0b1a14;--acb:#1b3a2e;--rd:#ff7b6b;--rdb:#3d2220;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--ln);padding:10px 14px 0}
button{font:inherit;color:inherit;cursor:pointer}
.mrow{display:flex;align-items:center;justify-content:space-between}
.mrow button{width:40px;height:40px;border-radius:12px;border:1px solid var(--ln);background:var(--bg);font-size:20px}
#mlabel{font-weight:700;font-size:17px}
#sum{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:10px 0}
#sum div{background:var(--bg);border-radius:12px;padding:8px 10px}
#sum b{font-size:13px}
small{display:block;color:var(--mu);font-size:12px}
.bad{color:var(--rd)}
.tabs{display:flex}
.tabs button{flex:1;border:0;background:none;padding:10px 0;color:var(--mu);font-weight:600;border-bottom:3px solid transparent}
.tabs button.on{color:var(--ac);border-color:var(--ac)}
main{padding:12px 14px;max-width:720px;margin:auto}
h2{display:flex;justify-content:space-between;align-items:baseline;font-size:17px;margin:18px 0 4px}
h2 span{font-size:12px;color:var(--mu);font-weight:500}
h3{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--mu);margin:12px 0 6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.rc{text-align:left;border:1px solid var(--ln);border-left:5px solid var(--ln);background:var(--card);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:2px;min-height:78px}
.rc b{font-size:14px;overflow-wrap:anywhere}
.rc em{font-style:normal;font-size:12px;font-weight:600}
.rc.ok{border-left-color:var(--ac)}.rc.ok em{color:var(--ac)}
.rc.no{border-left-color:var(--rd);background:var(--rdb)}.rc.no em{color:var(--rd)}
.rc.pt{border-left-color:#d68910}.rc.pt em{color:#d68910}
.rc.vac{opacity:.65}.rc.vac b{color:var(--mu);font-weight:500}
.row{width:100%;display:flex;justify-content:space-between;gap:10px;text-align:left;border:1px solid var(--ln);background:var(--card);border-radius:14px;padding:12px;margin-bottom:8px}
.amt{text-align:right;color:var(--rd);white-space:nowrap}
.note,.empty{color:var(--mu)}
.empty{text-align:center;padding:40px 10px}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 0}
input,select{display:block;width:100%;margin-top:4px;padding:11px;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
textarea{display:block;width:100%;padding:10px;font:inherit;font-size:13px;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:10px}
.pri,.danger{border:0;border-radius:12px;padding:12px 16px;font-weight:700}
.pri{background:var(--ac);color:var(--onac)}
.danger{background:var(--rdb);color:var(--rd)}
.btns{display:flex;gap:10px;margin-top:16px}.btns .pri{flex:1}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:4px 14px 14px;margin-bottom:14px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
#modal[hidden],#toast[hidden]{display:none}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:88%;overflow:auto;border-radius:20px 20px 0 0;padding:14px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet h2{margin-top:4px}
.hr{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--ln)}
.hr button{border:1px solid var(--rd);color:var(--rd);background:none;border-radius:10px;padding:7px 12px;font-size:13px}
.hr.ok button{border-color:var(--ac);color:var(--ac);background:var(--acb)}
.pi button{border-color:var(--ln);color:var(--tx);background:none}
.hr small{display:block}.hr.ok small{color:var(--ac)}.hr.pt small{color:#d68910}
.pi{display:flex;gap:6px;align-items:center}.pi input{width:112px;margin:0;padding:8px}
.gr{display:grid;grid-template-columns:.8fr .8fr .9fr 1.7fr 30px;gap:6px;margin-bottom:6px;align-items:center}.gr input{margin:0;padding:10px 8px}.gr small{margin:0}.x{border:0;background:none;color:var(--mu);font-size:16px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:30;font-size:14px}
.mrow #mlabel{flex:1;width:auto;border:0;background:none;font-weight:700;font-size:17px}
.cy{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.cy button{border:0;background:none;font-size:20px;padding:8px 18px;font-weight:700}
.cg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.cb{padding:14px 0;border:1px solid var(--ln);border-radius:999px;background:var(--bg)}
.cb.on{background:var(--ac);color:var(--onac);border-color:var(--ac)}.cb.td{border-color:var(--ac)}
.upd{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--acb);border:1px solid var(--ac);border-radius:14px;padding:10px 12px;margin-bottom:10px}
</style>
</head>
<body>
<header>
  <div class="mrow"><button id="pm" aria-label="Bulan sebelumnya">‹</button><button id="mlabel" class="ml"></button><button id="nm" aria-label="Bulan berikutnya">›</button></div>
  <div id="sum"></div>
  <div class="tabs"><button data-t="rooms">Kamar</button><button data-t="arr">Tunggakan</button><button data-t="set">Atur</button></div>
</header>
<main id="main"></main>
<div id="modal" hidden><div class="sheet" id="sheet"></div></div>
<div id="toast" hidden></div>
<script>
const $=id=>document.getElementById(id);
const KEY='kamar-v1',MN=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const ym=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
const lab=m=>MN[+m.slice(5)-1]+' '+m.slice(0,4);
const add=(m,k)=>ym(new Date(+m.slice(0,4),+m.slice(5)-1+k,1));
const rp=n=>'Rp '+Number(n||0).toLocaleString('id-ID');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S={rooms:[],pay:{}}; let srcQuery = '';
try{const r=localStorage.getItem(KEY);if(r)S=JSON.parse(r)}catch(e){}
const today=()=>new Date().toISOString().slice(0,10);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
let LAST=localStorage.getItem(KEY+'-last')||'';
const setLast=c=>{LAST=c;try{localStorage.setItem(KEY+'-last',c)}catch(e){}};
function save(...ks){
  try{localStorage.setItem(KEY,JSON.stringify(S));localStorage.setItem(KEY+'-at',String(Date.now()))}catch(e){}
  schedulePush();
}
const nowYM=ym(new Date());let cur=nowYM,tab='rooms',openId=null,tt;
const occ=r=>!!r.name,amt=(r,m)=>+(S.pay[r.id+'|'+m]||{}).a||0,left=(r,m)=>Math.max(0,(+r.rent||0)-amt(r,m)),paid=(r,m)=>amt(r,m)>0&&left(r,m)===0;
const occIn=(r,m)=>occ(r)&&(!r.since||m>=r.since);
const stat=(r,m)=>paid(r,m)?['ok','Lunas']:amt(r,m)?['pt','Kurang '+rp(left(r,m))]:['','Belum bayar'];
function toast(s,ms){const t=$('toast');t.textContent=s;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,ms||2200)}
function owed(r){const o=[];if(!occ(r))return o;let m=r.since||nowYM;while(m<=nowYM&&o.length<120){if(!paid(r,m))o.push(m);m=add(m,1)}return o}

function render(){
  $('mlabel').textContent=lab(cur);
  const oc=S.rooms.filter(r=>occIn(r,cur)),exp=oc.reduce((a,r)=>a+(+r.rent||0),0);
  const got=oc.reduce((a,r)=>a+amt(r,cur),0),kur=oc.reduce((a,r)=>a+left(r,cur),0),unp=oc.filter(r=>!paid(r,cur)).length;
  $('sum').innerHTML=`<div><small>Terkumpul</small><b>${rp(got)}</b></div><div><small>Target</small><b>${rp(exp)}</b></div><div><small>Kurang · ${unp} kamar</small><b class="${kur?'bad':''}">${rp(kur)}</b></div>`;
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  $('main').innerHTML=(UPD?'<div class="upd"><div><b>Pembaruan tersedia</b><small>Versi build '+UPD.n+'</small></div><button class="pri" id="upd">Update</button></div>':'')+(tab==='rooms'?vRooms():tab==='arr'?vArr():vSet());
}
const card=r=>{const o=occIn(r,cur),s=stat(r,cur),st=!o?'vac':s[0]||'no';
  return `<button class="rc ${st}" data-room="${r.id}"><small>${esc(r.code)}</small><b>${occ(r)?esc(r.name):'Kosong'}</b><em>${o?s[1]:(occ(r)?'Belum masuk':rp(r.rent))}</em></button>`};
function vRooms(){
  if(!S.rooms.length)return '<p class="empty">Belum ada kamar. Buat dulu di tab Atur.</p>';
  const searchInputHTML = `<div style="margin-bottom:12px;"><input type="text" id="srcR" value="${esc(srcQuery)}" placeholder="🔍 Cari kamar atau nama penghuni..." style="margin-top:0;"></div>`;
  let roomsToDisplay = S.rooms;
  if(srcQuery.trim()){
    const q = srcQuery.trim().toLowerCase();
    roomsToDisplay = S.rooms.filter(r => r.code.toLowerCase().includes(q) || (r.name && r.name.toLowerCase().includes(q)));
  }
  if(!roomsToDisplay.length){
    return searchInputHTML + `<p class="empty">Tidak ada kamar atau penghuni yang cocok dengan "${esc(srcQuery)}".</p>`;
  }
  const g={};
  roomsToDisplay.forEach(r=>{g[r.block]=g[r.block]||{};(g[r.block][r.floor]=g[r.block][r.floor]||[]).push(r)});
  return searchInputHTML + Object.keys(g).sort().map(b=>{
    const o=Object.values(g[b]).flat().filter(r=>occIn(r,cur)),ok=o.filter(r=>paid(r,cur)).length;
    return `<h2>Blok ${esc(b)}<span>${ok}/${o.length} lunas</span></h2>`+Object.keys(g[b]).sort((x,y)=>x-y).map(f=>
      `<h3>Lantai ${esc(f)}</h3><div class="grid">`+g[b][f].sort((x,y)=>x.code.localeCompare(y.code,'id',{numeric:true})).map(card).join('')+'</div>').join('');
  }).join('');
}
function vArr(){
  const L=S.rooms.map(r=>({r,m:owed(r)})).filter(x=>x.m.length).sort((a,b)=>b.m.length-a.m.length);
  if(!L.length)return `<p class="empty">Tidak ada tunggakan. Semua penghuni sudah lunas sampai ${lab(nowYM)}.</p>`;
  const lf=(r,m)=>m.reduce((a,x)=>a+left(r,x),0),tot=L.reduce((a,x)=>a+lf(x.r,x.m),0);
  return `<p class="note">${L.length} kamar menunggak · total ${rp(tot)}</p>`+L.map(({r,m})=>
    `<button class="row" data-room="${r.id}"><div><b>${esc(r.name)}</b><small>${esc(r.code)} · Blok ${esc(r.block)} Lt ${esc(r.floor)}</small><small>${m.slice(0,3).map(lab).join(', ')}${m.length>3?' +'+(m.length-3)+' lagi':''}</small></div><div class="amt"><b>${rp(lf(r,m))}</b><small>${m.length} bulan</small></div></button>`).join('');
}
let gRows=[{b:'A',f:'1',n:'10',r:''}];
function vSet(){
  const row=(x,i)=>'<div class="gr">'+[['b','text'],['f','number'],['n','number'],['r','number']].map(([k,t])=>`<input type="${t}" ${t==='number'?'inputmode="numeric"':'maxlength="4"'} data-gi="${i}" data-gk="${k}" value="${esc(x[k])}">`).join('')+`<button class="x" data-grm="${i}" aria-label="Hapus baris">✕</button></div>`;
  return `<h2>Buat kamar</h2><div class="card"><small style="margin:10px 0">Satu baris untuk setiap blok dan lantai. Isi jumlah kamarnya sendiri-sendiri.</small>
  <div class="gr"><small>Blok</small><small>Lantai</small><small>Kamar</small><small>Harga/bulan</small><span></span></div>${gRows.map(row).join('')}
  <div class="btns"><button class="danger" style="background:var(--bg);color:var(--tx)" data-gadd="b">+ Blok</button><button class="danger" style="background:var(--bg);color:var(--tx)" data-gadd="f">+ Lantai</button><button class="pri" id="go">Buat kamar</button></div>
  <small style="margin-top:10px">Contoh: blok A lantai 1 isi 10 kamar, blok B lantai 2 isi 20 kamar, jadi kodenya A101 sampai A110 dan B201 sampai B220. Kamar yang sudah ada tidak ditimpa. Nama penghuni diisi dengan mengetuk kamar.</small></div>
  ${vStruct()}<h2>Telegram</h2>${vShare()}${vApp()}<h2>Data & Laporan</h2><div class="card"><small style="margin:10px 0">${tgOn()?'Data disinkronkan lewat Telegram.':'Data tersimpan di HP ini. Isi pengaturan Telegram supaya bisa sinkron antar HP.'}</small><div class="btns" style="margin-bottom:10px;"><button class="pri" id="btnExportCSV" style="background:#27ae60;color:#fff;">📊 Ekspor Data (Excel/CSV)</button></div><button class="danger" id="rs">Hapus semua data</button></div>`;
}
const gl=()=>{const g={};S.rooms.forEach(r=>{const k=r.block+'|'+r.floor;(g[k]=g[k]||{b:r.block,f:r.floor,rs:[]}).rs.push(r)});
  return Object.values(g).sort((x,y)=>String(x.b).localeCompare(String(y.b))||x.f-y.f)};
function vStruct(){
  if(!S.rooms.length)return '';
  const row=g=>{const rt=[...new Set(g.rs.map(r=>+r.rent||0))],v=rt.length===1&&rt[0]?rt[0]:'',a=`data-gb="${esc(g.b)}" data-gf="${esc(g.f)}"`;
    return `<div class="gr"><input ${a} data-sf="b" maxlength="4" value="${esc(g.b)}"><input type="number" inputmode="numeric" ${a} data-sf="f" value="${esc(g.f)}"><input type="number" inputmode="numeric" ${a} data-sf="n" value="${g.rs.length}"><input type="number" inputmode="numeric" ${a} data-sf="r" value="${v}" placeholder="${rt.length>1?'beragam':'0'}"><button class="x" ${a} data-gdel="1" aria-label="Hapus lantai">✕</button></div>`};
  return `<h2>Kamar yang sudah ada</h2><div class="card"><small style="margin:10px 0">Ubah blok, lantai, jumlah kamar, atau harga untuk memperbaiki yang keliru. Mengurangi jumlah hanya menghapus kamar kosong dari nomor paling belakang. Mengisi harga mengubah harga semua kamar di baris itu.</small>
  <div class="gr"><small>Blok</small><small>Lantai</small><small>Kamar</small><small>Harga/bulan</small><span></span></div>${gl().map(row).join('')}</div>`;
}
function editGroup(el){
  const d=el.dataset,rs=S.rooms.filter(r=>String(r.block)===d.gb&&String(r.floor)===d.gf);if(!rs.length)return;
  const v=el.value.trim(),old=d.gb+d.gf;
  if(d.sf==='b'||d.sf==='f'){
    const nb=d.sf==='b'?v.toUpperCase():d.gb,nf=d.sf==='f'?Math.floor(+v):+d.gf;
    if(nb===d.gb&&String(nf)===d.gf)return;
    if(!nb||!(nf>=1)){el.value=d.sf==='b'?d.gb:d.gf;return toast('Blok dan lantai harus diisi')}
    if(S.rooms.some(r=>String(r.block)===nb&&String(r.floor)===String(nf))){el.value=d.sf==='b'?d.gb:d.gf;return toast('Blok dan lantai itu sudah ada')}
    rs.forEach(r=>{if(r.code.startsWith(old))r.code=nb+nf+r.code.slice(old.length);r.block=nb;r.floor=nf});
    el.closest('.gr').querySelectorAll('[data-gb]').forEach(x=>{x.dataset.gb=nb;x.dataset.gf=String(nf)});
    el.value=d.sf==='b'?nb:nf;
  }else if(d.sf==='r'){const p=+v;if(p>0)rs.forEach(r=>r.rent=p);else return}
  else if(d.sf==='n'){
    const c=Math.floor(+v),cnt=rs.length;
    if(!(c>=1&&c<=99)){el.value=cnt;return toast('Jumlah kamar 1 sampai 99')}
    if(c>cnt){let i=1,add=c-cnt;const rt=+rs[rs.length-1].rent||0;
      while(add>0&&i<=199){const code=d.gb+d.gf+String(i).padStart(2,'0');
        if(!S.rooms.some(r=>r.code===code)){S.rooms.push({id:uid(),block:rs[0].block,floor:rs[0].floor,code,name:'',rent:rt,since:nowYM});add--}i++}}
    else if(c<cnt){
      const free=rs.filter(r=>!occ(r)&&!Object.keys(S.pay).some(k=>k.startsWith(r.id+'|'))).sort((x,y)=>y.code.localeCompare(x.code,'id',{numeric:true})).slice(0,cnt-c);
      if(free.length<cnt-c){el.value=cnt;return toast('Kamar berpenghuni atau yang punya catatan bayar tidak dihapus')}
      const ids=new Set(free.map(r=>r.id));S.rooms=S.rooms.filter(r=>!ids.has(r.id))}
  }
  setLast(rs[rs.length-1].code);save('r');
}
function report(){
  const oc=S.rooms.filter(r=>occIn(r,cur)),got=oc.reduce((a,r)=>a+amt(r,cur),0),kur=oc.reduce((a,r)=>a+left(r,cur),0);
  const ls=oc.filter(r=>!paid(r,cur)).sort((a,b)=>a.code.localeCompare(b.code,'id',{numeric:true})).map(r=>'- '+r.code+' '+r.name+': '+(amt(r,cur)?'kurang '+rp(left(r,cur)):'belum bayar'));
  const tg=S.rooms.map(r=>({r,m:owed(r)})).filter(x=>x.m.length),tot=tg.reduce((a,x)=>a+x.m.reduce((s,m)=>s+left(x.r,m),0),0);
  return ['Laporan bayar kamar '+lab(cur),'Terkumpul '+rp(got)+', kurang '+rp(kur),ls.length?'Belum lunas bulan ini:\n'+ls.join('\n'):'Semua kamar berpenghuni sudah lunas bulan ini','Total tunggakan semua bulan: '+rp(tot)+' ('+tg.length+' kamar)'].join('\n\n');
}
function getLastFileInfoText(){
  try{
    const raw=localStorage.getItem(KEY+'-last-sync-file');
    if(!raw)return 'Belum ada riwayat file tersimpan.';
    const info=JSON.parse(raw);
    const dateStr=info.time?wib(info.time).d+' '+wib(info.time).h+' WIB':'';
    return 'File Terakhir: '+(info.name||'cadangan.json')+(dateStr?' ('+dateStr+')':'');
  }catch(e){return 'Belum ada riwayat file tersimpan.';}
}

function applySyncData(d,sourceName){
  if(!d||!Array.isArray(d.rooms)||!d.pay||typeof d.pay!=='object'){
    throw new Error('Format file data tidak valid');
  }
  S={rooms:d.rooms,pay:d.pay};
  LAST=d.last||'';
  try{
    localStorage.setItem(KEY,JSON.stringify(S));
    localStorage.setItem(KEY+'-at',String(d.at||Date.now()));
    localStorage.setItem(KEY+'-last',LAST);
    localStorage.setItem(KEY+'-last-sync-file',JSON.stringify({
      name:sourceName||'cadangan.json',
      time:Date.now(),
      data:d
    }));
  }catch(e){}
  setDirty(false);
  render();
  toast('Sinkronisasi berhasil: '+(sourceName||'File'));
}

function useLastSyncedFile(){
  try{
    const raw=localStorage.getItem(KEY+'-last-sync-file');
    if(!raw)return toast('Belum ada riwayat file terakhir',3000);
    const info=JSON.parse(raw);
    if(!info.data)return toast('Data file terakhir tidak ditemukan',3000);
    applySyncData(info.data,info.name+' (Riwayat Terakhir)');
  }catch(e){
    toast('Gagal memuat file terakhir: '+e.message,4000);
  }
}

function vShare(){
  const T=(k,l,ph)=>`<label>${l}<input data-tg="${k}" value="${esc(TG[k]||'')}" placeholder="${ph}" autocomplete="off" autocapitalize="off" spellcheck="false"></label>`;
  const lastFileInfo=getLastFileInfoText();

async function tg(m,f){
  for(let n=0;n<2;n++){
    const ac=new AbortController(),to=setTimeout(()=>ac.abort(),25000);let j;
    try{j=await (await fetch('https://api.telegram.org/bot'+TG.t+'/'+m,{method:'POST',body:f,signal:ac.signal})).json()}
    catch(e){throw new Error(e.name==='AbortError'?'koneksi terlalu lama':'tidak bisa terhubung ke Telegram, cek internet')}
    finally{clearTimeout(to)}
    if(j.ok)return j.result;
    const mg=j.parameters&&j.parameters.migrate_to_chat_id;
    const cid=f.has('chat_id')?f.get('chat_id'):'';
    if(mg&&n===0&&cid){if(cid===TG.a)TG.a=String(mg);else TG.c=String(mg);tgSave();f.set('chat_id',String(mg));continue}

async function tgPush(manual){
  if(!tgOn())return tgStat('Isi token bot dan Chat ID dulu',true);

  if(TG.hold)return;
  if(busy){clearTimeout(pt);pt=setTimeout(()=>tgPush(manual),2000);return}

    const at=lat(),name=fname(),w=wib(at),cap='KAMAR-SYNC | terakhir diubah: '+(LAST||'-')+' | '+w.d+' '+w.h+' WIB';

async function tgPull(manual){

function exportCSV(){
  if(!S.rooms.length) return toast('Belum ada data kamar untuk diekspor');
  let csv = '\uFEFF"Kode Kamar","Blok","Lantai","Nama Penghuni","Harga Sewa (Rp)","Mulai Tinggal","Masa Sewa Habis","Bulan Tagihan","Dibayar (Rp)","Status","Tanggal Bayar"\n';
  S.rooms.forEach(r => {
    let m = r.since || cur;
    const end = nowYM > cur ? nowYM : cur;
    const months = [];
    while(m <= end && months.length < 120){
      months.push(m);
      m = add(m, 1);
    }
    months.forEach(mo => {
      const g = amt(r, mo);
      const payInfo = S.pay[r.id + '|' + mo] || {};
      const s = stat(r, mo);
      const row = [
        `"${r.code}"`,
        `"${r.block}"`,
        `"${r.floor}"`,
        `"${(r.name||'Kosong').replace(/"/g, '""')}"`,
        r.rent || 0,
        `"${r.since || ''}"`,
        `"${r.until || ''}"`,
        `"${lab(mo)}"`,
        g,
        `"${s[1]}"`,
        `"${payInfo.d || ''}"`
      ];
      csv += row.join(',') + '\n';
    });
  });
  const blob = new Blob([csv], {type: 'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `Rekap_CatatanBayarKamar_${today()}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('Data berhasil diekspor ke file CSV/Excel');
}

  if(d.room)return openRoom(d.room);
  if(b.id==='go')return gen();
  if(d.gadd){const l=gRows[gRows.length-1]||{b:'A',f:'1',n:'10',r:''};
    if(d.gadd==='b'){const nb=l.b.length===1?String.fromCharCode(l.b.toUpperCase().charCodeAt(0)+1):l.b;gRows.push({b:nb,f:l.f,n:l.n,r:l.r})}
    else gRows.push({b:l.b,f:String((+l.f||0)+1),n:l.n,r:l.r});
    render();return}
  if(d.gdel){
    if(!d.a){d.a=1;b.textContent='✓';b.style.color='var(--rd)';toast('Tap sekali lagi untuk menghapus lantai ini beserta catatan bayarnya');return}
    const ids=new Set(S.rooms.filter(r=>String(r.block)===d.gb&&String(r.floor)===d.gf).map(r=>r.id)),ks=Object.keys(S.pay).filter(k=>ids.has(k.split('|')[0]));
    S.rooms=S.rooms.filter(r=>!ids.has(r.id));ks.forEach(k=>delete S.pay[k]);save('r',...new Set(ks.map(k=>k.split('|')[1])));render();return}
  if(b.id==='tg')return tgReport();
  if(b.id==='cp'){const t=$('rpt');t.select();if(navigator.clipboard)navigator.clipboard.writeText(t.value).catch(()=>document.execCommand('copy'));else document.execCommand('copy');toast('Laporan disalin');return}
  if(b.id==='bk')return tgPush(true);
  if(b.id==='rb')return tgPull(true);
  if(b.id==='btnPickFile'){const fi=$('syncFileInput');if(fi)fi.click();return}
  if(b.id==='btnLastFile')return useLastSyncedFile();
  if(b.id==='btnExportCSV')return exportCSV();
  if(d.kw)return openKwitansi(d.rid, d.kw);
  if(b.id==='btnCopyKw'){
    const t=$('kwTxt');if(t){t.select();if(navigator.clipboard)navigator.clipboard.writeText(t.value).catch(()=>document.execCommand('copy'));else document.execCommand('copy');toast('Kwitansi disalin');}
    return;
  }
  if(b.id==='btnWaKw'){
    const t=$('kwTxt');if(t){window.open('https://wa.me/?text='+encodeURIComponent(t.value),'_blank');}
    return;
  }
  if(d.grm!==undefined){gRows.splice(+d.grm,1);render();return}
  if(b.id==='rs'){if(d.a){const ms=[...new Set(Object.keys(S.pay).map(k=>k.split('|')[1]))];S={rooms:[],pay:{}};setLast('SEMUA');save('r',...ms);render();toast('Data dihapus')}else{d.a=1;b.textContent='Yakin? Tap sekali lagi'}return}
  const r=S.rooms.find(x=>x.id===openId);if(!r)return;
  if(d.full){if(!(+r.rent))return toast('Isi harga per bulan dulu');const k=r.id+'|'+d.full;S.pay[k]={d:(S.pay[k]&&S.pay[k].d)||today(),a:+r.rent};setLast(r.code);save(d.full);render();$('hist').innerHTML=hist(r)}
  else if(d.close)closeM();
  else if(d.del){if(d.a){const ks=Object.keys(S.pay).filter(k=>k.startsWith(r.id+'|'));S.rooms=S.rooms.filter(x=>x.id!==r.id);ks.forEach(k=>delete S.pay[k]);setLast(r.code);save('r',...ks.map(k=>k.split('|')[1]));closeM()}else{d.a=1;b.textContent='Yakin? Tap lagi'}}
});
render();
initTG();
</script>
</body>
</html>
