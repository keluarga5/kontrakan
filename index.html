<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catatan Bayar Kamar</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #f4f6f8;
            --card-bg: #ffffff;
            --primary: #0088cc;
            --text: #333333;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 16px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
        }
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        h2 { margin-top: 0; color: var(--primary); }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-weight: bold; margin-bottom: 4px; }
        input, select, button {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }
        button {
            background: var(--primary);
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
        }
        .item {
            border-bottom: 1px solid #eee;
            padding: 8px 0;
            display: flex;
            justify-content: space-between;
        }
        .status-badge {
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 4px;
            background: #e1f5fe;
            color: #0288d1;
            margin-bottom: 10px;
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h2>Catatan Bayar Kamar</h2>
            <div id="tgStatus" class="status-badge">Telegram WebApp Ready</div>
            <form id="payForm">
                <div class="form-group">
                    <label>Nama Penghuni / No. Kamar</label>
                    <input type="text" id="kamar" required placeholder="Contoh: Kamar 101 - Budi">
                </div>
                <div class="form-group">
                    <label>Jumlah (Rp)</label>
                    <input type="number" id="jumlah" required placeholder="1000000">
                </div>
                <div class="form-group">
                    <label>Tanggal Pembayaran</label>
                    <input type="date" id="tanggal" required>
                </div>
                <button type="submit">Simpan & Sinkronkan</button>
            </form>
        </div>

        <div class="card">
            <h3>Riwayat Pembayaran</h3>
            <div id="history"></div>
        </div>
    </div>

    <script>
        // Inisialisasi Telegram WebApp dengan aman untuk mencegah 'Failed to fetch' & error CORS
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        document.getElementById('tanggal').valueAsDate = new Date();

        function loadHistory() {
            const data = JSON.parse(localStorage.getItem('catatan_bayar') || '[]');
            const historyDiv = document.getElementById('history');
            if (data.length === 0) {
                historyDiv.innerHTML = '<p style="color:#888">Belum ada catatan.</p>';
                return;
            }
            historyDiv.innerHTML = data.map(item => `
                <div class="item">
                    <div><strong>${item.kamar}</strong><br><small>${item.tanggal}</small></div>
                    <div><strong>Rp ${Number(item.jumlah).toLocaleString('id-ID')}</strong></div>
                </div>
            `).join('');
        }

        // Fungsi aman sinkronisasi Telegram tanpa error fetch
        async function syncToTelegram(payload) {
            if (tg && tg.sendData) {
                try {
                    tg.sendData(JSON.stringify(payload));
                } catch (err) {
                    console.warn("Gagal via Telegram sendData, fallback ke storage lokal:", err);
                }
            }
        }

        document.getElementById('payForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const kamar = document.getElementById('kamar').value;
            const jumlah = document.getElementById('jumlah').value;
            const tanggal = document.getElementById('tanggal').value;

            const payload = { kamar, jumlah, tanggal, timestamp: new Date().toISOString() };

            const data = JSON.parse(localStorage.getItem('catatan_bayar') || '[]');
            data.unshift(payload);
            localStorage.setItem('catatan_bayar', JSON.stringify(data));

            await syncToTelegram({ action: 'add_payment', ...payload });

            this.reset();
            document.getElementById('tanggal').valueAsDate = new Date();
            loadHistory();
        });

        loadHistory();
    </script>
</body>
</html>
